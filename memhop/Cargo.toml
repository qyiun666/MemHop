[package]
name = "memhop"
version = "0.18.0"
edition = "2024"
description = "Hypergraph-based associative memory engine for AI Agents — pure ngram + BM25"

[lib]
crate-type = ["rlib"]

[dependencies]
heed = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
half = { version = "2", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
usearch = "2.5"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "memhop_bench"
harness = false
