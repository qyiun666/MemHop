[package]
name = "memhop"
version = "0.6.0"
edition = "2024"
description = "Embedded associative memory engine powered by Modern Hopfield Networks — SQLite for associative memory"

[lib]
crate-type = ["rlib"]

[dependencies]
heed = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
zstd = "0.13"
half = { version = "2", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
rayon = "1"

[dev-dependencies]
tempfile = "3"
