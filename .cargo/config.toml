# macOS SDK C++ include path for esaxx-rs and other C++ dependencies.
# Required because /Library/Developer/CommandLineTools/usr/include/c++/v1/ is
# incomplete (missing <cstdint>). The SDK copy is the canonical source.
[env]
CPLUS_INCLUDE_PATH = "/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk/usr/include/c++/v1"

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]
