[package]
name = "candle-encoder"
version = "0.1.0"
edition = "2021"
description = "Rust gRPC encoder server using candle + granite-embedding-278m-multilingual"

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = "0.23"
half = "2.4"
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }

[build-dependencies]
tonic-build = "0.12"
