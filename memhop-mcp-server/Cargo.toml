[package]
name = "memhop-mcp-server"
version = "0.9.1"
edition = "2024"
description = "MCP (Model Context Protocol) server for MemHop — associative memory MCP tool"

[[bin]]
name = "memhop-mcp-server"
path = "src/main.rs"

[dependencies]
memhop = { path = "../memhop" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
half = "2"
