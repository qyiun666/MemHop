[package]
name = "memhop"
version = "0.41.0"
edition = "2021"
description = "Agent-oriented memory database inspired by human brain cognitive architecture"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
# Core dependencies
twox-hash = { version = "1.6", default-features = false }
half = { version = "2.4", default-features = false, features = ["std", "serde"] }
memmap2 = "0.9"
thiserror = "1.0"
crc32fast = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "blocking"] }
bincode = "1.3"
chrono = "0.4"
regex = "1.10"

[dev-dependencies]
tempfile = "3.10"
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"
libloading = "0.8"

# Temporarily disabled - needs update to new API
# [[bench]]
# name = "performance_bench"
# harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
