[package]
name = "memhop"
version = "0.51.1"
edition = "2021"
description = "Agent-oriented memory database inspired by human brain cognitive architecture"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
# Core dependencies
twox-hash = { version = "1.6", default-features = false }
half = { version = "2.4", default-features = false, features = ["std", "serde"] }
memmap2 = "0.9"
thiserror = "2"
crc32fast = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "blocking", "native-tls"] }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
# tower = "0.4"    # unused — removed in v0.50.0
# hyper-util = "0.1" # unused — removed in v0.50.0
# tokio-stream = "0.1" # unused — removed in v0.50.0
bincode = "1.3"
chrono = "0.4"
regex = "1.10"
jieba-rs = "0.7"
leiden-rs = "0.8"
pest = "2.7"
pest_derive = "2.7"

[dev-dependencies]
tempfile = "3.10"
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"

[build-dependencies]
tonic-build = "0.12"

# Temporarily disabled - needs update to new API
# [[bench]]
# name = "performance_bench"
# harness = false

[[bench]]
name = "agent_workflow"
harness = false

[[bench]]
name = "e2e_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
strip = false
debug = 1
