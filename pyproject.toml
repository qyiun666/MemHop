[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "memhop"
version = "0.2.0"
description = "SQLite for associative memory — embedded, single-file, zero-config associative memory engine powered by Modern Hopfield Networks"
authors = [{name = "MemHop Contributors"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["memory", "associative", "hopfield", "embedding", "lmdb", "vector"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/qyiun666/MemHop"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-benchmark>=4.0"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "memhop._core"

[tool.pytest.ini_options]
testpaths = ["tests"]