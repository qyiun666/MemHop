[package]
name = "memhop-encoder"
version.workspace = true
edition.workspace = true
description = "Standalone encoder service for MemHop — loads models, listens on Unix Socket or TCP, handles encoding requests"

[[bin]]
name = "memhop-encoder"
path = "src/main.rs"

[features]
default = ["candle"]
candle = ["memhop-core/candle", "candle-core", "candle-nn", "candle-transformers", "tokenizers"]

[dependencies]
clap = { version = "4", features = ["derive"] }
memhop-core = { path = "../memhop-core" }
memhop-protocol = { path = "../memhop-protocol" }
tokio = { version = "1", features = ["full"] }
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
tokenizers = { version = "0.21", optional = true }
