[package]
name = "memhop-protocol"
version.workspace = true
edition.workspace = true
description = "Shared IPC protocol definition for memhop-encoder and memhop-encoder-client"

[dependencies]
serde = { version = "1", features = ["derive"] }
half = { version = "2", features = ["serde"] }
bincode = "1"
tokio = { version = "1", features = ["net", "io-util", "fs"] }
