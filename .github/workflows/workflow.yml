name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Check memhop-core
        run: cargo check -p memhop-core
      - name: Clippy memhop-core
        run: cargo clippy -p memhop-core -- -D warnings
      - name: Test memhop-core
        run: cargo test -p memhop-core

  # Note: memhop-encoder requires C++ toolchain for tokenizers (esaxx-rs)
  # Build manually if needed, or use a separate CI job with C++ setup
