name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        run: go build ./memhop/...

      - name: Vet
        run: go vet ./memhop/... ./test/...

      - name: Unit tests
        run: go test ./memhop/...
