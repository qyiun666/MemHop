name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        if: runner.os != 'Windows'
        run: |
          unformatted=$(gofmt -l api internal cmd test)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Unit tests (includes public SDK and offline MCP smoke tests)
        run: go test ./...

      - name: Unit tests (race)
        run: go test -race ./internal/...

      # Integration tests require real Ollama + LLM credentials; without
      # MEMHOP_TEST_LLM_KEY the suite skips, so this step mainly verifies
      # that the integration-tagged code compiles on all platforms.
      - name: Integration tests (skipped without LLM credentials)
        if: runner.os == 'Linux'
        run: go test -tags=integration ./test/...
