name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        run: go build ./api/... ./internal/...

      - name: Vet
        run: go vet ./api/... ./internal/... ./test/...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l api internal test)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Unit tests
        run: go test ./api/... ./internal/...

      - name: Unit tests (race)
        run: go test -race ./api/... ./internal/...

      - name: Integration tests (offline/mock)
        run: go test ./test/...
