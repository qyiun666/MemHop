name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Read the version out of the module instead of pinning one here: a second
          # copy of that fact drifts, and it already did — the module has required
          # go 1.27.0 since 9549159 while this file still said 1.26, so every run
          # installed a toolchain the build then refused and quietly upgraded past
          # by downloading the real one.
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        if: runner.os != 'Windows'
        run: |
          unformatted=$(gofmt -l api internal test)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Unit tests (public SDK and internal suites)
        run: go test ./...

      # The integration guides carry a runnable skeleton each; `go build` of the
      # packages never compiles it, so a guide a host copies verbatim can rot
      # silently. This is the machine check behind the promise that a host can paste the guide and build.
      - name: Guides compile (both integration guides' skeletons)
        if: runner.os != 'Windows'
        run: make check-guides

      # The race check covers the whole module, not just the packages that hold locks:
      # the consolidation a round close schedules runs on its own goroutine, and the
      # host-facing suite is where that pass races a test's own reads. Measured on the
      # current tree: `go test -race ./...` 29.4s wall against 25.0s without it — the
      # coverage is nearly free, so there is no reason to scope the step down.
      - name: Unit tests (race)
        run: go test -race ./...

      # Integration tests require real Ollama + LLM credentials; without
      # MEMHOP_TEST_LLM_KEY the suite skips, so this step mainly verifies
      # that the integration-tagged code compiles on all platforms.
      - name: Integration tests (skipped without LLM credentials)
        if: runner.os != 'Windows'
        run: go test -tags=integration ./test/...
