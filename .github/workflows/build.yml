# Cross-platform build for libmemhop (cdylib)
# Builds: macOS (x86_64 + arm64 → universal) · Linux (.so) · Windows (.dll)
# On tag push (v*), creates a GitHub Release with all binaries.
name: build

on:
  push:
    branches: [main, master, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ─── Linux ───────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev pkg-config
      - name: Build release
        run: cargo build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmemhop-linux-x86_64
          path: target/release/libmemhop.so
          if-no-files-found: error

  # ─── Windows ─────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build release
        run: cargo build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: memhop-windows-x86_64
          path: target/release/memhop.dll
          if-no-files-found: error

  # ─── macOS Intel (cross-compile on macos-14) ─────────────
  build-macos-x86:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build release (x86_64)
        run: cargo build --release --target x86_64-apple-darwin
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmemhop-macos-x86_64
          path: target/x86_64-apple-darwin/release/libmemhop.dylib
          if-no-files-found: error

  # ─── macOS Apple Silicon ─────────────────────────────────
  build-macos-arm:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build release (arm64)
        run: cargo build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmemhop-macos-arm64
          path: target/release/libmemhop.dylib
          if-no-files-found: error

  # ─── macOS Universal Binary (lipo) ───────────────────────
  create-universal:
    needs: [build-macos-x86, build-macos-arm]
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: libmemhop-macos-x86_64
          path: macos-x86
      - uses: actions/download-artifact@v4
        with:
          name: libmemhop-macos-arm64
          path: macos-arm
      - name: Create universal binary
        run: |
          lipo -create \
            macos-x86/libmemhop.dylib \
            macos-arm/libmemhop.dylib \
            -output libmemhop-universal.dylib
          lipo -info libmemhop-universal.dylib
      - name: Upload universal binary
        uses: actions/upload-artifact@v4
        with:
          name: libmemhop-macos-universal
          path: libmemhop-universal.dylib
          if-no-files-found: error

  # ─── GitHub Release (only on tag push) ───────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, create-universal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/libmemhop-linux-x86_64/libmemhop.so release/libmemhop-linux-x86_64.so
          cp artifacts/memhop-windows-x86_64/memhop.dll release/memhop-windows-x86_64.dll
          cp artifacts/libmemhop-macos-universal/libmemhop-universal.dylib release/libmemhop-macos-universal.dylib
          cp memhop.h release/memhop.h

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/libmemhop-linux-x86_64.so
            release/memhop-windows-x86_64.dll
            release/libmemhop-macos-universal.dylib
            release/memhop.h
          generate_release_notes: true
          draft: false
          prerelease: false
