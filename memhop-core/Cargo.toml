[package]
name = "memhop-core"
version.workspace = true
edition.workspace = true
description = "Hypergraph-based associative memory engine for AI Agents — BM25 + HNSW dual-channel retrieval"

[lib]
crate-type = ["rlib"]

[features]
default = []
candle = ["candle-core", "candle-nn", "candle-transformers", "tokenizers", "dirs"]
bench = []
bench-llm = ["bench"]  # LLM 集成测试 feature
llm-api = ["reqwest"]  # LLM API 调用 feature

[dependencies]
heed = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
half = { version = "2", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
lru = "0.18.0"  # LRU cache for forward index optimization
reqwest = { version = "0.12", features = ["json"], optional = true }  # HTTP client for LLM API

# Candle dependencies (optional, for BERT encoding)
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
tokenizers = { version = "0.21", optional = true }
dirs = { version = "5", optional = true }
usearch = "2.25.3"

redb = "2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "memhop_bench"
harness = false
required-features = ["bench"]

[[bench]]
name = "retrieval_bench"
harness = false
required-features = ["bench"]

[[bench]]
name = "functional_bench"
harness = false
required-features = ["bench"]

[[bench]]
name = "memory_bench"
harness = false
required-features = ["bench"]

[[bench]]
name = "integration_bench"
harness = false
required-features = ["bench"]

[[bench]]
name = "agent_e2e_bench"
harness = false
required-features = ["bench"]

[[bench]]
name = "dataset_bench"
harness = false
required-features = ["bench"]

[[bench]]
name = "llm_integration_bench"
harness = false
required-features = ["bench"]

[[bench]]
name = "longmemeval_bench"
harness = false
required-features = ["bench"]
