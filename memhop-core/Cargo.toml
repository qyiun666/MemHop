[package]
name = "memhop-core"
version = "0.23.0"
edition = "2024"
description = "Hypergraph-based associative memory engine for AI Agents — BM25 + HNSW dual-channel retrieval"

[lib]
crate-type = ["rlib"]

[features]
default = []
candle = ["candle-core", "candle-nn", "candle-transformers", "tokenizers"]
bench = []

[dependencies]
heed = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
half = { version = "2", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"

# Candle dependencies (optional, for BERT encoding)
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
tokenizers = { version = "0.21", optional = true }
fast-hnsw = "1.0.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "memhop_bench"
harness = false
required-features = ["bench"]

[[bench]]
name = "retrieval_bench"
harness = false
required-features = ["bench"]

[[bench]]
name = "functional_bench"
harness = false
required-features = ["bench"]

[[bench]]
name = "memory_bench"
harness = false
required-features = ["bench"]

[[bench]]
name = "integration_bench"
harness = false
required-features = ["bench"]
