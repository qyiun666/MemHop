[package]
name = "memhop-encoder-client"
version = "0.23.0"
edition = "2024"
description = "IPC client library for MemHop encoder service — implements Encoder trait via Unix Socket"

[lib]
crate-type = ["rlib"]

[dependencies]
memhop-core = { path = "../memhop-core" }
tokio = { version = "1", features = ["net", "io-util", "rt", "sync"] }
half = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
