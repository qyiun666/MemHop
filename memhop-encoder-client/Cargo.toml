[package]
name = "memhop-encoder-client"
version.workspace = true
edition.workspace = true
description = "IPC client library for MemHop encoder service — implements Encoder trait via Unix Socket or TCP"

[lib]
crate-type = ["rlib"]

[dependencies]
memhop-core = { path = "../memhop-core" }
memhop-protocol = { path = "../memhop-protocol" }
tokio = { version = "1", features = ["net", "io-util", "rt", "sync"] }
